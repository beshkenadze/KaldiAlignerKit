name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --quiet

  format:
    name: SwiftFormat
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: swiftformat . --lint

  path-hygiene:
    name: Path Hygiene
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Reject hardcoded local paths in owned files
        run: |
          ! git grep -nE '/Volumes/DATA|/Downloads|/Documents/MFA|/usr/bin/ditto|NSHomeDirectory\(' -- \
            Package.swift README.md Sources/SwiftKaldiBench scripts .github/workflows \
            ':(exclude).github/workflows/ci.yml'

  build-test:
    name: Source Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install automake autoconf libtool

      - name: Render source manifest
        run: ./scripts/render-package-manifest.sh source

      - name: Build Kaldi
        run: ./scripts/build-kaldi.sh "$PWD/.build/vendor/kaldi"

      - name: Build package
        run: KALDI_ROOT="$PWD/.build/vendor/kaldi" swift build --target KaldiAlignerKit

      - name: Run tests
        run: KALDI_ROOT="$PWD/.build/vendor/kaldi" swift test

  binary-consumer-smoke:
    name: Binary Consumer Smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate checked-in binary manifest
        run: swift package dump-package

      - name: Install build dependencies
        run: brew install automake autoconf libtool

      - name: Render source manifest
        run: ./scripts/render-package-manifest.sh source

      - name: Build xcframework
        run: ./scripts/build-xcframework.sh ci-smoke

      - name: Build clean client against binary target
        run: ./scripts/run-binary-consumer-smoke.sh
